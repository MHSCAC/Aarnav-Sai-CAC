<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListenLink - Accessibility Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #FDFBF7; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; padding: 24px; }
    
    /* Header & Top Bar Controls */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0; gap: 12px; }
    .status-indicator { font-size: 14px; color: #888; display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block; }

    /* Accessibility Controls Bar */
    .accessibility-tools { display: flex; align-items: center; gap: 8px; }
    .tool-btn { background-color: #222; border: 1px solid #444; color: #E0E0E0; padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .tool-btn:hover { background-color: #333; }
    .font-toggle-group { display: flex; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
    .font-toggle-group button { background: #222; border: none; color: #888; padding: 6px 10px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .font-toggle-group button.active { background: #2B82F6; color: white; }

    /* Live Caption Header & Scrollable History Body */
    .caption-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; gap: 16px; padding-right: 8px; }
    
    /* Font Size Dynamic Variables */
    .caption-container.font-normal .transcript-line { font-size: 28px; }
    .caption-container.font-large .transcript-line { font-size: 36px; }
    .caption-container.font-xlarge .transcript-line { font-size: 48px; }

    .transcript-line { font-weight: 500; line-height: 1.4; color: #E0E0E0; border-bottom: 1px solid #222; padding-bottom: 12px; word-break: break-word; transition: font-size 0.2s ease; }
    .transcript-line.interim { color: #888; font-style: italic; }

    /* Custom Scrollbar Styling */
    .caption-container::-webkit-scrollbar { width: 6px; }
    .caption-container::-webkit-scrollbar-thumb { background-color: #333; border-radius: 4px; }

    /* Controls & Buttons */
    .controls { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; flex-shrink: 0; }
    .btn { background-color: #2B82F6; color: white; border: none; padding: 18px; border-radius: 30px; font-size: 20px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-secondary { background-color: #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Reply Drawer (Modal) */
    .modal { display: none; position: fixed; bottom: 0; left: 0; right: 0; background-color: #1E1E1E; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 24px; box-shadow: 0 -5px 25px rgba(0,0,0,0.5); }
    .modal.active { display: block; }
    textarea { width: 100%; height: 120px; background-color: #2A2A2A; color: white; border: 1px solid #444; border-radius: 12px; padding: 16px; font-size: 18px; resize: none; outline: none; }
    
    /* Voice Selection Control */
    .voice-select-container { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .voice-select-container label { font-size: 16px; color: #ccc; }
    select { background-color: #2A2A2A; color: white; border: 1px solid #444; border-radius: 8px; padding: 8px 12px; font-size: 16px; outline: none; }

    .modal-buttons { display: flex; gap: 10px; margin-top: 16px; }
    .modal-buttons .btn { flex: 1; }
  </style>
</head>
<body>

  <!-- Top Bar Controls -->
  <div class="top-bar">
    <div class="status-indicator">
      <span class="pulse-dot" id="dot"></span>
      <span id="status">Tap 'Start Listening' to grant mic access</span>
    </div>

    <div class="accessibility-tools">
      <!-- Font Size Toggle Group -->
      <div class="font-toggle-group">
        <button id="fontNormBtn" class="active" onclick="setFontSize('normal')">A</button>
        <button id="fontLgBtn" onclick="setFontSize('large')">A+</button>
        <button id="fontXlBtn" onclick="setFontSize('xlarge')">A++</button>
      </div>
      <!-- Clear History Button -->
      <button class="tool-btn" onclick="clearTranscript()">Clear</button>
    </div>
  </div>

  <!-- Live Caption History Display Area -->
  <div class="caption-container font-normal" id="captionContainer">
    <div class="transcript-line interim" id="currentInterim">Speech captions will appear here in real time...</div>
  </div>

  <!-- Bottom Main Action -->
  <div class="controls">
    <button class="btn btn-secondary" id="micBtn" onclick="toggleListening()">Start Listening</button>
    <button class="btn" onclick="openReplyModal()">Reply</button>
  </div>

  <!-- Speech Response Modal -->
  <div class="modal" id="replyModal">
    <textarea id="replyInput" placeholder="Type your response..."></textarea>
    
    <!-- Voice Selector -->
    <div class="voice-select-container">
      <label for="voiceSelect">Voice Gender:</label>
      <select id="voiceSelect">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="modal-buttons">
      <button class="btn btn-secondary" id="cancelBtn" onclick="closeReplyModal()">Cancel</button>
      <button class="btn" id="sendBtn" onclick="sendAndSpeak()">Send & Speak</button>
    </div>
  </div>

  <script>
    const captionContainer = document.getElementById('captionContainer');
    const currentInterim = document.getElementById('currentInterim');
    const statusText = document.getElementById('status');
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const dot = document.getElementById('dot');
    let isListening = false;
    let recognition;

    // Initialize Web Speech Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          
          if (event.results[i].isFinal) {
            const newLine = document.createElement('div');
            newLine.className = 'transcript-line';
            newLine.innerText = transcript.trim();
            
            captionContainer.insertBefore(newLine, currentInterim);
            currentInterim.innerText = '';
          } else {
            interimTranscript += transcript;
          }
        }

        if (interimTranscript) {
          currentInterim.innerText = interimTranscript;
        }

        captionContainer.scrollTop = captionContainer.scrollHeight;
      };

      recognition.onerror = (e) => {
        statusText.innerText = "Error: " + e.error;
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
      };
    } else {
      currentInterim.innerText = "Speech recognition is not supported in this browser. Please use Chrome or Safari.";
    }

    function toggleListening() {
      if (!recognition) return;
      if (!isListening) {
        recognition.start();
        isListening = true;
        micBtn.innerText = "Pause Listening";
        statusText.innerText = "Microphone Active";
        dot.style.backgroundColor = "#22c55e";
      } else {
        isListening = false;
        recognition.stop();
        micBtn.innerText = "Start Listening";
        statusText.innerText = "Microphone Paused";
        dot.style.backgroundColor = "#ef4444";
      }
    }

    /* Font Size Controller */
    function setFontSize(size) {
      captionContainer.classList.remove('font-normal', 'font-large', 'font-xlarge');
      captionContainer.classList.add('font-' + size);

      document.getElementById('fontNormBtn').classList.toggle('active', size === 'normal');
      document.getElementById('fontLgBtn').classList.toggle('active', size === 'large');
      document.getElementById('fontXlBtn').classList.toggle('active', size === 'xlarge');
    }

    /* Clear Transcript Function */
    function clearTranscript() {
      const historyLines = captionContainer.querySelectorAll('.transcript-line:not(.interim)');
      historyLines.forEach(line => line.remove());
      currentInterim.innerText = isListening ? 'Listening...' : 'Speech captions will appear here in real time...';
    }

    function openReplyModal() {
      document.getElementById('replyModal').classList.add('active');
      document.getElementById('replyInput').focus();
    }

    function closeReplyModal() {
      document.getElementById('replyModal').classList.remove('active');
    }

    /* Render Kokoro TTS Voice Service */
    async function sendAndSpeak() {
      const input = document.getElementById('replyInput');
      const text = input.value.trim();
      const selectedVoice = document.getElementById('voiceSelect').value;
      
      if (!text) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "Generating...";

      try {
        // REPLACE 'YOUR-APP-NAME' WITH YOUR ACTUAL RENDER SERVICE NAME
        const response = await fetch('https://YOUR-APP-NAME.onrender.com/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            text: text,
            voice: selectedVoice 
          })
        });

        if (response.ok) {
          const audioBlob = await response.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          const audio = new Audio(audioUrl);
          
          await audio.play();

          input.value = "";
          closeReplyModal();
        } else {
          const errorMsg = await response.text();
          alert("Server error: " + errorMsg);
        }
      } catch (err) {
        alert("Network error: Make sure your Render server URL is correct.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send & Speak";
      }
    }
  </script>
</body>
</html>
